# Local environment. The API takes its secrets (database URL, ingestion key) from
# Vault, not from variables. The values below are for this machine only (a throwaway
# Postgres and a dev-mode Vault); they can be changed in a .env file next to this one.
# Production does not use Vault: Vercel and GitHub hold the secrets as variables.
x-vault-env: &vault-env
  VAULT_ADDR: http://vault:8200
  VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-dev-only-token}

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: scouting
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-scouting}
      POSTGRES_DB: scouting
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scouting"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dev mode: in memory, unsealed, KV v2 mounted at secret/. Never for production.
  vault:
    image: hashicorp/vault:2.1.1
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-dev-only-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Writes the app's secrets into Vault once it is up (dev mode forgets them on restart).
  vault-init:
    image: hashicorp/vault:2.1.1
    environment: *vault-env
    entrypoint: ["vault"]
    command:
      - kv
      - put
      - secret/el-regista
      - database_url=postgresql+psycopg://scouting:${LOCAL_DB_PASSWORD:-scouting}@db:5432/scouting
      - ingestion_api_key=${LOCAL_INGESTION_API_KEY:-local-ingestion-key}
    depends_on:
      vault:
        condition: service_healthy

  api:
    build: .
    environment:
      <<: *vault-env
      CORS_ORIGINS: http://localhost:3000
      # Off as in production; the DAST run turns it on to hand ZAP the endpoint list.
      EXPOSE_DOCS: ${EXPOSE_DOCS:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
