[project]
name = "player-scouting"
version = "0.1.0"
description = "El Regista: scout y pronósticos de fútbol con datos reales"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "beautifulsoup4>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/player_scouting"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# CSV/HTML fixtures copied verbatim from real responses.
"tests/infrastructure/fbref_kaggle/test_mapper.py" = ["E501"]
"tests/infrastructure/transfermarkt/test_mapper.py" = ["E501"]
# Brand generators: glyph and icon coordinates read best one shape per line.
"scripts/brand/*.py" = ["E501", "E731"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
