# Production on the Oracle Cloud Always Free VM (ARM, 4 cores, 24 GB): web, API and
# Caddy (HTTPS with Let's Encrypt). No CPU quotas and no account-wide pauses, unlike
# Vercel Hobby, which paused every project in Nov 2026 for "fluidCpuDuration".
# Secrets live in deploy/oracle/.env on the VM (never in the repo): see .env.example.
# Optional local Postgres ("localdb" profile) to stop depending on Neon's 5 GB/month.
name: elregista

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  api:
    build: ../..
    restart: unless-stopped
    env_file: .env
    environment:
      CORS_ORIGINS: https://${DOMAIN}
      # The web's server-side requests all arrive from one address (the Docker
      # bridge): the per-address limit must leave room for them.
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-6000}
    expose:
      - "8000"

  web:
    build:
      context: ../../web
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
    # Server-side fetches to https://api.<domain> go straight to this machine's Caddy.
    extra_hosts:
      - "api.${DOMAIN}:host-gateway"
    expose:
      - "3000"
    depends_on:
      - api

  db:
    profiles: ["localdb"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scouting
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-}
      POSTGRES_DB: scouting
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scouting"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
