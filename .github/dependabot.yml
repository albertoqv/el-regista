# Weekly pull requests for outdated or vulnerable dependencies.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Both break `npm run lint` (Oct 2026): typescript-eslint does not support
      # TypeScript 7 and eslint-config-next's React plugin fails on ESLint 10.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Base images of both Dockerfiles (backend at the root, web in /web).
  - package-ecosystem: docker
    directories:
      - /
      - /web
    schedule:
      interval: weekly
  # Images of the local stack (Postgres, Vault).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
