name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scouting
          POSTGRES_PASSWORD: scouting
          POSTGRES_DB: scouting
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scouting"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://scouting:scouting@localhost:5432/scouting

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Run pytest
        run: uv run pytest

      - name: Run mypy
        run: uv run mypy

      - name: Run ruff
        run: uv run ruff check .

  audit:
    # Known vulnerabilities in what production installs (fails the build).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Python dependencies
        run: |
          uv export --no-hashes --no-dev --no-emit-project --format requirements-txt > requirements.txt
          uvx pip-audit -r requirements.txt --no-deps --disable-pip
      - name: Web dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
