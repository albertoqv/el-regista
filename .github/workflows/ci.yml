name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scouting
          POSTGRES_PASSWORD: scouting
          POSTGRES_DB: scouting
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scouting"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://scouting:scouting@localhost:5432/scouting

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Run pytest
        run: uv run pytest

      - name: Run mypy
        run: uv run mypy

      - name: Run ruff
        run: uv run ruff check .

  audit:
    # Known vulnerabilities in what production installs (fails the build).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Python dependencies
        run: |
          uv export --no-hashes --no-dev --no-emit-project --format requirements-txt > requirements.txt
          uvx pip-audit -r requirements.txt --no-deps --disable-pip
      - name: Web dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  web-e2e:
    # The web as it would deploy (production build) against the live API, before Vercel.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.API_BASE_URL }}
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The build generates the route types (PageProps) that tsc needs.
      - run: npm run build
      - run: npx tsc --noEmit && npm run lint
      - run: npx playwright install --with-deps chromium
      - name: Recorridos contra la build local
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/robots.txt > /dev/null && break; sleep 2; done
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-ci
          path: web/test-results
          retention-days: 14
