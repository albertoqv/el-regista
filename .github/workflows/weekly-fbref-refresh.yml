name: Weekly data refresh

on:
  schedule:
    # The source Kaggle dataset is regenerated every Monday.
    - cron: "0 6 * * 2"
  workflow_dispatch:
    inputs:
      start_year:
        description: "Season start year (e.g. 2026 for 2026/27). Empty = current season."
        required: false
        default: ""

jobs:
  refresh-season:
    runs-on: ubuntu-latest

    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      INGESTION_API_KEY: ${{ secrets.INGESTION_API_KEY }}

    steps:
      - name: Resolve the season
        env:
          START_YEAR: ${{ inputs.start_year }}
        run: |
          if [ -z "$START_YEAR" ]; then
            MONTH=$(date -u +%-m)
            YEAR=$(date -u +%Y)
            if [ "$MONTH" -ge 7 ]; then START_YEAR=$YEAR; else START_YEAR=$((YEAR - 1)); fi
          fi
          echo "START_YEAR=$START_YEAR" >> "$GITHUB_ENV"

      - name: Basic statistics (FBref)
        run: |
          curl --fail-with-body -sS --max-time 600 -X POST \
            "$API_BASE_URL/ingestion/fbref/seasons/$START_YEAR" \
            -H "X-Ingestion-Key: $INGESTION_API_KEY" | jq '{ingested, skipped: (.skipped | length)}'

      - name: Advanced metrics (Understat)
        run: |
          curl --fail-with-body -sS --max-time 600 -X POST \
            "$API_BASE_URL/ingestion/understat/seasons/$START_YEAR" \
            -H "X-Ingestion-Key: $INGESTION_API_KEY" | jq '{ingested, skipped: (.skipped | length)}'

      - name: Merge players FBref spelled in two ways
        run: |
          curl --fail-with-body -sS --max-time 600 -X POST             "$API_BASE_URL/ingestion/maintenance/merge-duplicates"             -H "X-Ingestion-Key: $INGESTION_API_KEY"

      - name: Shots of the new matches (Understat)
        run: |
          # Only matches not stored yet; loop in batches until none is left.
          for batch in $(seq 1 10); do
            RESULT=$(curl --fail-with-body -sS --max-time 600 -X POST               "$API_BASE_URL/ingestion/understat/shots/$START_YEAR?limit=120"               -H "X-Ingestion-Key: $INGESTION_API_KEY")
            echo "$RESULT"
            [ "$(echo "$RESULT" | jq .remaining)" = "0" ] && break
          done

      # Transfermarkt throttles Railway's IP, so the lookups run on this runner
      # (a different IP each run) and only the results go to the API.
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Photos, birth dates and market values (Transfermarkt)
        run: uv run python scripts/enrich_remote.py --limit 400
