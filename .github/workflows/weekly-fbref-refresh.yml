name: Weekly data refresh

on:
  schedule:
    # The source Kaggle dataset is regenerated every Monday.
    - cron: "0 6 * * 2"
    # Friday: fresh results and forecasts before the weekend fixtures.
    - cron: "0 6 * * 5"
  # Pushing this file starts a run (no token needed to launch it from a commit).
  push:
    paths: [".github/refresh-now"]
  workflow_dispatch:
    inputs:
      start_year:
        description: "Season start year (e.g. 2026 for 2026/27). Empty = current season."
        required: false
        default: ""

# One refresh at a time: a second one waits instead of writing the same data and
# reading Transfermarkt twice.
concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh-season:
    runs-on: ubuntu-latest

    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      INGESTION_API_KEY: ${{ secrets.INGESTION_API_KEY }}
      # With DATABASE_URL (Neon) the ingestion runs on this runner against a local API
      # writing to that database: no time limits, and the public API only reads.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # Neon's free plan allows 5 GB of transfer a month and past it may suspend the
      # database until the next one. With little left, only what the forecasts need
      # runs (results, fixtures, odds, the forecast log); player data waits a few days.
      - name: How much Neon transfer is left?
        id: budget
        run: |
          token=$(curl -sf -X POST "$API_BASE_URL/admin/session" \
            -H "X-Ingestion-Key: $(printf '%s' "$INGESTION_API_KEY" | tr -d '[:space:]')" | jq -r .token || true)
          left=$(curl -sf "$API_BASE_URL/admin/dashboard" -H "Authorization: Bearer $token" \
            | jq -r '.database_usage | if . then (.transfer_limit_bytes - .transfer_bytes) else "unknown" end' || echo unknown)
          if [ "$left" != "unknown" ] && [ "$left" -lt 600000000 ]; then
            echo "low=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Neon transfer::$((left / 1000000)) MB left this month: player steps skipped"
          else
            echo "::notice title=Neon transfer::left this month: ${left}"
          fi

      - name: Start a local API on the database
        if: env.DATABASE_URL != ''
        run: |
          uv run alembic upgrade head
          # Through a counting proxy: every step reports how much Neon sent (5 GB/month).
          proxied=$(uv run python - <<'PY'
          import os
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit
          url = urlsplit(os.environ["DATABASE_URL"])
          endpoint = url.hostname.split(".")[0].removesuffix("-pooler")
          query = dict(parse_qsl(url.query))
          query["options"] = f"endpoint={endpoint}"
          netloc = f"{url.username}:{url.password}@127.0.0.1:6543"
          print(urlunsplit((url.scheme, netloc, url.path, urlencode(query), "")))
          host = url.hostname
          open(os.environ["RUNNER_TEMP"] + "/neon_host", "w").write(host)
          PY
          )
          echo "::add-mask::$proxied"
          nohup python3 scripts/egress_proxy.py "$(cat "$RUNNER_TEMP/neon_host")" 5432 \
            "$RUNNER_TEMP/egress-bytes" > "$RUNNER_TEMP/proxy.log" 2>&1 &
          sleep 1
          DATABASE_URL="$proxied" INGESTION_API_KEY= RATE_LIMIT_PER_MINUTE=100000 nohup uv run uvicorn \
            player_scouting.presentation.api.main:app --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 2; done
          # The measurement must never stop the refresh: without the database through
          # the proxy, start the API straight on Neon (unmeasured).
          if ! curl -sf http://127.0.0.1:8000/health/db; then
            echo "::warning title=Neon transfer::proxy not usable, this run is not measured"
            pkill -f uvicorn || true
            sleep 2
            INGESTION_API_KEY= RATE_LIMIT_PER_MINUTE=100000 nohup uv run uvicorn \
              player_scouting.presentation.api.main:app --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
            for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health/db && break; sleep 2; done
          fi
          echo "API_BASE_URL=http://127.0.0.1:8000" >> "$GITHUB_ENV"

      - name: Resolve the season
        env:
          START_YEAR: ${{ inputs.start_year }}
        run: |
          if [ -z "$START_YEAR" ]; then
            MONTH=$(date -u +%-m)
            YEAR=$(date -u +%Y)
            if [ "$MONTH" -ge 7 ]; then START_YEAR=$YEAR; else START_YEAR=$((YEAR - 1)); fi
          fi
          echo "START_YEAR=$START_YEAR" >> "$GITHUB_ENV"
          # A secret pasted from a Windows file can end in CR/LF, which turns the
          # X-Ingestion-Key header into an invalid HTTP request (uvicorn refuses it).
          echo "INGESTION_API_KEY=$(printf '%s' "$INGESTION_API_KEY" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          # post PATH: authenticated POST to the ingestion API, fails the step on errors.
          cat > "$RUNNER_TEMP/post.sh" <<'EOF'
          # On an error it leaves an annotation with the status and the start of the body.
          post() {
            local out status body before
            before=$(cat "$RUNNER_TEMP/egress-bytes" 2>/dev/null || echo 0)
            trap 'echo "::notice title=Neon $1::$(( ($(cat "$RUNNER_TEMP/egress-bytes" 2>/dev/null || echo 0) - before) / 1000000 )) MB" >&2; trap - RETURN' RETURN
            if ! out=$(curl -sS --max-time "${POST_MAX_TIME:-900}" -X POST -w '\n%{http_code}' \
                "$API_BASE_URL$1" -H "X-Ingestion-Key: $INGESTION_API_KEY" 2>&1); then
              echo "::error title=POST $1::${out:0:300}" >&2
              return 1
            fi
            status=${out##*$'\n'}
            body=${out%$'\n'*}
            if [ "$status" -ge 400 ]; then
              echo "::error title=POST $1 ($status)::${body:0:300}" >&2
              return 1
            fi
            echo "$body"
          }
          # until_done PATH: repeat a batched ingestion until nothing is left.
          until_done() {
            for batch in $(seq 1 15); do
              result=$(post "$1")
              echo "$result"
              [ "$(echo "$result" | jq .remaining)" = "0" ] && return 0
            done
          }
          EOF

      - name: Basic statistics (FBref)
        if: steps.budget.outputs.low != 'true'
        run: |
          source "$RUNNER_TEMP/post.sh"
          post "/ingestion/fbref/seasons/$START_YEAR" | jq -c '{ingested, skipped: (.skipped | length)}'

      - name: Advanced metrics (Understat)
        if: steps.budget.outputs.low != 'true'
        run: |
          source "$RUNNER_TEMP/post.sh"
          post "/ingestion/understat/seasons/$START_YEAR" | jq -c '{ingested, skipped: (.skipped | length)}'

      # The Transfermarkt dataset changes rarely (it stood still from July to October
      # 2026), and processing it reads players and values from Neon, whose free plan
      # allows 5 GB of transfer a month: only when its ETag is new.
      - name: Has the Transfermarkt dataset changed?
        id: dataset
        run: |
          etag=$(curl -s -L -r 0-0 -D - -o /dev/null \
            https://www.kaggle.com/api/v1/datasets/download/davidcariboo/player-scores \
            | tr -d '\r' | awk -F': ' 'tolower($1) == "etag" {print $2}' | tr -d '"' | tail -1)
          echo "etag=${etag:-unknown-$GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          mkdir -p .dataset-seen && echo "$etag" > .dataset-seen/etag
      - uses: actions/cache/restore@v5
        id: seen
        with:
          path: .dataset-seen
          key: transfermarkt-dataset-${{ steps.dataset.outputs.etag }}

      - name: Photos, height, roles and other leagues (Transfermarkt dataset)
        if: steps.seen.outputs.cache-hit != 'true' && steps.budget.outputs.low != 'true'
        # One request walks ~19k profiles against the database: its time depends on
        # how far from Neon the runner lands, so it gets an hour.
        env:
          POST_MAX_TIME: "3600"
        run: |
          source "$RUNNER_TEMP/post.sh"
          post "/ingestion/transfermarkt-dataset/profiles" | jq -c '{ingested}'
          for YEAR in $START_YEAR $((START_YEAR - 1)); do
            post "/ingestion/transfermarkt-dataset/seasons/$YEAR" | jq -c '{ingested, skipped: (.skipped | length)}'
          done
          # Champions League, cups, super cups and national teams, season by season.
          post "/ingestion/transfermarkt-dataset/competitions" | jq -c '{ingested}'
          # Market value model: refitted on the fresh data, one estimate per player.
          post "/ingestion/valuations" | jq -c .
      - uses: actions/cache/save@v5
        if: steps.seen.outputs.cache-hit != 'true' && steps.budget.outputs.low != 'true'
        with:
          path: .dataset-seen
          key: transfermarkt-dataset-${{ steps.dataset.outputs.etag }}

      - name: Merge players FBref spelled in two ways
        if: steps.budget.outputs.low != 'true'
        run: source "$RUNNER_TEMP/post.sh" && post "/ingestion/maintenance/merge-duplicates"

      - name: Calendar, results and team metrics (Understat)
        run: source "$RUNNER_TEMP/post.sh" && post "/ingestion/understat/teams/$START_YEAR"

      - name: Corners, cards, fouls, shots and odds (football-data.co.uk)
        run: source "$RUNNER_TEMP/post.sh" && post "/ingestion/football-data/seasons/$START_YEAR"

      - name: Shots of the new matches (Understat)
        if: steps.budget.outputs.low != 'true'
        run: source "$RUNNER_TEMP/post.sh" && until_done "/ingestion/understat/shots/$START_YEAR?limit=60"

      - name: Player lines of the new matches (Understat rosters)
        if: steps.budget.outputs.low != 'true'
        run: source "$RUNNER_TEMP/post.sh" && until_done "/ingestion/understat/rosters/$START_YEAR?limit=40"

      # Track record: log this week's forecasts before kickoff, with fresh odds.
      - name: Log the forecasts of the coming days
        run: source "$RUNNER_TEMP/post.sh" && post "/ingestion/predictions/snapshot?days=7"

      # Right after a refresh every match played days ago must have its result:
      # if not, a source changed or broke and GitHub emails the failure.
      - name: Check that played matches have their results
        run: |
          curl -sS --max-time 120 "$API_BASE_URL/health/data" | tee "$RUNNER_TEMP/data.json" | jq .
          [ "$(jq -r .status "$RUNNER_TEMP/data.json")" = "ok" ]

      # Transfermarkt throttles servers' IPs, so the lookups run on this runner
      # (a different IP each run) and only the results go to the API.
      - name: Season in progress of 28 more leagues and second divisions (Transfermarkt)
        if: steps.budget.outputs.low != 'true'
        run: uv run python scripts/scrape_leagues_remote.py --season "$START_YEAR" --backfill
      - name: Photos, birth dates and market values (Transfermarkt)
        if: steps.budget.outputs.low != 'true'
        run: uv run python scripts/enrich_remote.py --limit 400

      - name: Neon transfer of this run
        if: always() && env.DATABASE_URL != ''
        run: |
          echo "::notice title=Neon total::$(( $(cat "$RUNNER_TEMP/egress-bytes" 2>/dev/null || echo 0) / 1000000 )) MB sent by the database in this run"

      # Job logs need repository rights to read; annotations do not. The last error
      # lines of the local API, so a failed run says why.
      - name: Why the local API failed
        if: failure() && env.DATABASE_URL != ''
        run: |
          tail -n 12 "$RUNNER_TEMP/api.log" \
            | sed -E 's/postgres(ql)?(\+psycopg)?:\/\/[^ ]*/<database-url>/g; s/^/::notice title=API log::/'
