name: Weekly data refresh

on:
  schedule:
    # The source Kaggle dataset is regenerated every Monday.
    - cron: "0 6 * * 2"
    # Friday: fresh results and forecasts before the weekend fixtures.
    - cron: "0 6 * * 5"
  workflow_dispatch:
    inputs:
      start_year:
        description: "Season start year (e.g. 2026 for 2026/27). Empty = current season."
        required: false
        default: ""

jobs:
  refresh-season:
    runs-on: ubuntu-latest

    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      INGESTION_API_KEY: ${{ secrets.INGESTION_API_KEY }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Resolve the season
        env:
          START_YEAR: ${{ inputs.start_year }}
        run: |
          if [ -z "$START_YEAR" ]; then
            MONTH=$(date -u +%-m)
            YEAR=$(date -u +%Y)
            if [ "$MONTH" -ge 7 ]; then START_YEAR=$YEAR; else START_YEAR=$((YEAR - 1)); fi
          fi
          echo "START_YEAR=$START_YEAR" >> "$GITHUB_ENV"
          # post PATH: authenticated POST to the ingestion API, fails the step on errors.
          cat > "$RUNNER_TEMP/post.sh" <<'EOF'
          post() {
            curl --fail-with-body -sS --max-time 900 -X POST \
              "$API_BASE_URL$1" \
              -H "X-Ingestion-Key: $INGESTION_API_KEY"
            echo
          }
          # until_done PATH: repeat a batched ingestion until nothing is left.
          until_done() {
            for batch in $(seq 1 15); do
              result=$(post "$1")
              echo "$result"
              [ "$(echo "$result" | jq .remaining)" = "0" ] && return 0
            done
          }
          EOF

      - name: Basic statistics (FBref)
        run: |
          source "$RUNNER_TEMP/post.sh"
          post "/ingestion/fbref/seasons/$START_YEAR" | jq -c '{ingested, skipped: (.skipped | length)}'

      - name: Advanced metrics (Understat)
        run: |
          source "$RUNNER_TEMP/post.sh"
          post "/ingestion/understat/seasons/$START_YEAR" | jq -c '{ingested, skipped: (.skipped | length)}'

      - name: Photos, height, roles and other leagues (Transfermarkt dataset)
        run: |
          source "$RUNNER_TEMP/post.sh"
          post "/ingestion/transfermarkt-dataset/profiles" | jq -c '{ingested}'
          for YEAR in $START_YEAR $((START_YEAR - 1)); do
            post "/ingestion/transfermarkt-dataset/seasons/$YEAR" | jq -c '{ingested, skipped: (.skipped | length)}'
          done

      - name: Merge players FBref spelled in two ways
        run: source "$RUNNER_TEMP/post.sh" && post "/ingestion/maintenance/merge-duplicates"

      - name: Calendar, results and team metrics (Understat)
        run: source "$RUNNER_TEMP/post.sh" && post "/ingestion/understat/teams/$START_YEAR"

      - name: Corners, cards, fouls, shots and odds (football-data.co.uk)
        run: source "$RUNNER_TEMP/post.sh" && post "/ingestion/football-data/seasons/$START_YEAR"

      - name: Shots of the new matches (Understat)
        run: source "$RUNNER_TEMP/post.sh" && until_done "/ingestion/understat/shots/$START_YEAR?limit=60"

      - name: Player lines of the new matches (Understat rosters)
        run: source "$RUNNER_TEMP/post.sh" && until_done "/ingestion/understat/rosters/$START_YEAR?limit=40"

      # Track record: log this week's forecasts before kickoff, with fresh odds.
      - name: Log the forecasts of the coming days
        run: source "$RUNNER_TEMP/post.sh" && post "/ingestion/predictions/snapshot?days=7"

      # Transfermarkt throttles Railway's IP, so the lookups run on this runner
      # (a different IP each run) and only the results go to the API.
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Photos, birth dates and market values (Transfermarkt)
        run: uv run python scripts/enrich_remote.py --limit 400
