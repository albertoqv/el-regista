name: Mark the Transfermarkt dataset as processed

# One-off: the dataset now on Kaggle was already processed on 8 Oct 2026, before the
# refresh learnt to skip unchanged ones. Saves the same cache key the refresh checks,
# so the next refresh does not read it again. Touches no database.
on:
  push:
    paths: [".github/seed-dataset-cache"]

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Dataset ETag
        id: dataset
        run: |
          etag=$(curl -s -L -r 0-0 -D - -o /dev/null \
            https://www.kaggle.com/api/v1/datasets/download/davidcariboo/player-scores \
            | tr -d '\r' | awk -F': ' 'tolower($1) == "etag" {print $2}' | tr -d '"' | tail -1)
          echo "etag=$etag" >> "$GITHUB_OUTPUT"
          mkdir -p .dataset-seen && echo "$etag" > .dataset-seen/etag
          echo "::notice title=Dataset::ETag $etag marked as processed"
      - uses: actions/cache/save@v5
        if: steps.dataset.outputs.etag != ''
        with:
          path: .dataset-seen
          key: transfermarkt-dataset-${{ steps.dataset.outputs.etag }}
