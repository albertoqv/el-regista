name: Transfermarkt probe

# Diagnostic: how Transfermarkt answers a GitHub runner. Writes what it saw to the
# tm-probe-results branch (logs need admin rights to read).
on:
  push:
    paths: [".github/tm-probe"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          {
            for url in \
              "https://www.transfermarkt.com/lamine-yamal/profil/spieler/937958" \
              "https://www.transfermarkt.com/schnellsuche/ergebnis/schnellsuche?query=Pedri" \
              "https://www.transfermarkt.com/wettbewerb/startseite/wettbewerb/PO1/saison_id/2026"; do
              echo "== $url"
              curl -sS -m 30 -o page.html -D headers.txt -w 'code=%{http_code} ip=%{remote_ip} time=%{time_total}\n' -A "$UA" "$url" 2>&1 || echo "curl exit $?"
              head -12 headers.txt 2>/dev/null
              head -c 600 page.html 2>/dev/null | tr '\n' ' '; echo
            done
            echo "== runner ip"; curl -s -m 10 https://api.ipify.org; echo
          } > result.txt 2>&1
      - name: save
        run: |
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git checkout --orphan tm-probe-results
          cp result.txt /tmp/result.txt && git rm -rfq . && cp /tmp/result.txt result.txt && git add result.txt && git commit -qm "probe $(date -u +%H:%M)"
          git push -f origin tm-probe-results
