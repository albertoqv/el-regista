name: Transfermarkt probe

# Diagnostic: how Transfermarkt answers a GitHub runner (one step per possible code).
on:
  push:
    paths: [".github/tm-probe"]

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
      URL: https://www.transfermarkt.com/lamine-yamal/profil/spieler/937958
    steps:
      - name: fetch
        run: |
          curl -s -o page.html -w '%{http_code}' -A "$UA" "$URL" > code.txt || true
          curl -s -o /dev/null -w '%{http_code}' -L -A "$UA" "$URL" > code_follow.txt || true
          curl -s -o search.html -w '%{http_code}' -A "$UA" "https://www.transfermarkt.com/schnellsuche/ergebnis/schnellsuche?query=Pedri" > code_search.txt || true
      - { name: "profile is 404", if: always(), run: 'test "$(cat code.txt)" = 404' }
      - { name: "profile is 000 (connection cut)", if: always(), run: 'test "$(cat code.txt)" = 000' }
      - { name: "profile is another 4xx", if: always(), run: 'grep -q "^4" code.txt' }
      - { name: "search is 404", if: always(), run: 'test "$(cat code_search.txt)" = 404' }
      - { name: "search is 000", if: always(), run: 'test "$(cat code_search.txt)" = 000' }
      - { name: "search is a redirect", if: always(), run: 'grep -q "^30" code_search.txt' }
