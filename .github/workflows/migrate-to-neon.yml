name: Move the database (live API -> DATABASE_URL)

# Copies every row the live API serves into the database in the DATABASE_URL secret.
# Used for Railway -> Neon Frankfurt and then Neon Frankfurt -> Neon Washington (iad1,
# next to Vercel's functions and GitHub's runners). The guard stops it if the target
# already has data. Needs the secrets INGESTION_API_KEY and DATABASE_URL.
on:
  workflow_dispatch:
  # Also started by pushing this file, so it can be launched from a commit.
  push:
    paths: [".github/database-move"]

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      # The live API, still reading the old database until it is redeployed.
      API_BASE_URL: https://el-regista-api.vercel.app
      INGESTION_API_KEY: ${{ secrets.INGESTION_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Download the current data from the live API
        run: |
          curl -sS --fail-with-body --retry 3 --retry-delay 20 --max-time 1200 \
            -H "X-Ingestion-Key: $INGESTION_API_KEY" \
            -o elregista.sql.gz "$API_BASE_URL/ingestion/backup"
          gzip -t elregista.sql.gz
          ls -lh elregista.sql.gz
      - name: Create the tables in the new database
        run: uv run alembic upgrade head
      # The restore replaces every row: never over a database already in use.
      - name: Stop if the new database already has players
        run: |
          uv run python - <<'PY'
          import sys
          from sqlalchemy import create_engine, text
          from player_scouting.infrastructure.persistence.settings import get_settings
          with create_engine(get_settings().database_url).connect() as c:
              players = c.execute(text("select count(*) from players")).scalar()
          print("players already there:", players)
          sys.exit(1 if players else 0)
          PY
      - name: Restore every row
        run: uv run python scripts/db_copy.py restore elregista.sql.gz
      - name: Check what arrived
        run: |
          uv run python - <<'PY'
          from sqlalchemy import create_engine, text
          from player_scouting.infrastructure.persistence.settings import get_settings
          with create_engine(get_settings().database_url).connect() as c:
              for table in ("players", "player_season_statistics", "shots", "fixtures", "prediction_snapshots"):
                  print(table, c.execute(text(f"select count(*) from {table}")).scalar())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: database-move-copy
          path: elregista.sql.gz
          retention-days: 90
