name: Web quality

on:
  schedule:
    # Every morning, after any overnight deploy.
    - cron: "40 7 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site to test (empty = production)"
        required: false
        default: ""

env:
  BASE_URL: ${{ inputs.base_url || 'https://elregista.vercel.app' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 14

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ env.BASE_URL }}/
            ${{ env.BASE_URL }}/predicciones
            ${{ env.BASE_URL }}/ranking/laliga/goleadores
          configPath: web/lighthouserc.json
          uploadArtifacts: true
