name: Security

# DevSecOps checks on every push and pull request. Results go to the repository's
# Security tab (SARIF). See "Seguridad (DevSecOps)" in the README.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # SAST: community rules for Python and TypeScript, plus secrets. No account or token.
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Semgrep
        run: |
          uvx semgrep scan --metrics=off \
            --config p/python --config p/typescript --config p/secrets \
            --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && github.actor != 'dependabot[bot]'
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # SAST for the Python backend (settings in [tool.bandit] of pyproject.toml).
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Bandit
        run: |
          uvx --from "bandit[sarif,toml]" bandit -c pyproject.toml -r src \
            -f sarif -o bandit.sarif --exit-zero
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && github.actor != 'dependabot[bot]'
        with:
          sarif_file: bandit.sarif
          category: bandit

  # Secrets in the code and in every commit of the history. Accepted findings, with
  # their reason, in .gitleaksignore.
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION
          file=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSLO "$base/$file" -O "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $file\$" gitleaks_${GITLEAKS_VERSION}_checksums.txt | sha256sum -c
          tar -xzf "$file" gitleaks
      - name: Gitleaks
        run: |
          ./gitleaks git . --redact --no-banner --exit-code 0 \
            --report-format sarif --report-path gitleaks.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && github.actor != 'dependabot[bot]'
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # Containers: Dockerfile and Compose configuration, and the HIGH/CRITICAL CVEs of
  # both images (OS packages and libraries) that already have a fix.
  trivy:
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: 0.75.0
    steps:
      - uses: actions/checkout@v7
      # The binary at a fixed version with its checksum, rather than a third-party
      # action whose tag could be moved.
      - name: Install Trivy (checksum verified)
        run: |
          base=https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION
          file=trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz
          curl -sSLO "$base/$file" -O "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " $file\$" trivy_${TRIVY_VERSION}_checksums.txt | sha256sum -c
          tar -xzf "$file" trivy
      - name: Configuration (Dockerfiles, Compose)
        run: |
          ./trivy config --quiet --exit-code 0 --format sarif --output trivy-config.sarif .
          ./trivy config --quiet --exit-code 0 .
      - name: Build the images
        run: |
          docker build -t el-regista-api .
          docker build -t el-regista-web web
      - name: Image vulnerabilities (HIGH, CRITICAL)
        run: |
          for image in api web; do
            ./trivy image --quiet --exit-code 0 --ignore-unfixed --severity HIGH,CRITICAL \
              --format sarif --output trivy-$image.sarif el-regista-$image
            ./trivy image --quiet --exit-code 0 --ignore-unfixed --severity HIGH,CRITICAL \
              --format json --output trivy-$image.json el-regista-$image
            jq -r --arg image "$image" '
              [.Results[]?.Vulnerabilities[]?] as $v
              | "::notice title=Trivy \($image)::HIGH \([$v[] | select(.Severity=="HIGH")] | length), CRITICAL \([$v[] | select(.Severity=="CRITICAL")] | length): \([$v[] | "\(.PkgName) \(.VulnerabilityID) (\(.PkgPath // "os"))"] | unique | join(", "))"
            ' trivy-$image.json
          done
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && github.actor != 'dependabot[bot]'
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && github.actor != 'dependabot[bot]'
        with:
          sarif_file: trivy-api.sarif
          category: trivy-image-api
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && github.actor != 'dependabot[bot]'
        with:
          sarif_file: trivy-web.sarif
          category: trivy-image-web
