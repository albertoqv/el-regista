name: Web e2e

# The web as it would deploy, against the live API. Only when the web changes: every run
# reads from the production database, which has a monthly network allowance (Neon free).
on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web-e2e.yml"
  pull_request:
    paths:
      - "web/**"
  workflow_dispatch:

jobs:
  web-e2e:
    # The web as it would deploy (production build) against the live API, before Vercel.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # The public API on Vercel (the build reads live data from it).
      NEXT_PUBLIC_API_URL: https://el-regista-api.vercel.app
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The build generates the route types (PageProps) that tsc needs.
      - run: npm run build
      - run: npx tsc --noEmit && npm run lint
      - run: npx playwright install --with-deps chromium
      - name: Recorridos contra la build local
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/robots.txt > /dev/null && break; sleep 2; done
          npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-ci
          path: web/test-results
          retention-days: 14
