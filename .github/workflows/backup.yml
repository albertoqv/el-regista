name: Weekly database backup

on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      INGESTION_API_KEY: ${{ secrets.INGESTION_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Neon is reachable from here: dump it directly (COPY blocks, data only).
      - name: Dump the database
        if: env.DATABASE_URL != ''
        run: uv run python scripts/db_copy.py dump elregista.sql.gz
      # Before the move, the database lived on Railway's private network: through the API.
      - name: Download the dump through the API
        if: env.DATABASE_URL == ''
        run: |
          curl -sS --fail-with-body --retry 3 --retry-delay 20 --max-time 1200 \
            -H "X-Ingestion-Key: $INGESTION_API_KEY" \
            -o elregista.sql.gz "$API_BASE_URL/ingestion/backup"
      - name: Check the dump
        run: |
          gzip -t elregista.sql.gz
          ls -lh elregista.sql.gz
          tables=$(zcat elregista.sql.gz | grep -c '^COPY ')
          echo "tables: $tables"
          [ "$tables" -ge 13 ]
          # A dump without players means something went badly wrong.
          [ "$(zcat elregista.sql.gz | sed -n '/^COPY "players"/,/^\\.$/p' | wc -l)" -gt 1000 ]

      - uses: actions/upload-artifact@v7
        with:
          name: elregista-${{ github.run_number }}
          path: elregista.sql.gz
          retention-days: 90
          compression-level: 0
