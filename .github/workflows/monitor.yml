name: Monitor

on:
  schedule:
    # Every 3 hours: often enough to notice, rare enough not to keep a
    # sleeping (serverless) API awake and billing.
    - cron: "23 */3 * * *"
  workflow_dispatch:

jobs:
  uptime:
    runs-on: ubuntu-latest
    env:
      # Both public: the API on Vercel and the web.
      API_BASE_URL: https://el-regista-api.vercel.app
      SITE_URL: https://elregista.vercel.app
    steps:
      # A sleeping API takes a few seconds to wake: retry before failing.
      - name: API answers
        run: curl -sS --fail --retry 4 --retry-delay 20 --retry-all-errors --max-time 60 "$API_BASE_URL/health"

      - name: Web answers with real data
        run: |
          for path in / /predicciones /ranking/laliga/goleadores; do
            code=$(curl -sS -o page.html -w '%{http_code}' --retry 3 --retry-delay 15 --max-time 60 "$SITE_URL$path")
            echo "$path $code"
            [ "$code" = "200" ] || exit 1
          done
          # The ranking page is empty when the API failed while rendering it.
          grep -q '/players/' page.html
